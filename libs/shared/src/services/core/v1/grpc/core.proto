syntax = "proto3";

package core;

import "relayer.proto";
import "integration-account.proto";
import "payment.proto";

service Relayer {
  rpc getRelayerAccount (GetRelayerQuery) returns (RelayerResponse);
}

service IntegrationAccount {
  rpc hasAccount (HasAccountQuery) returns (HasAccountResponse);
}

service Payment {
  rpc createPayment (CreatePaymentQuery) returns (CreatePaymentResponse);
}
