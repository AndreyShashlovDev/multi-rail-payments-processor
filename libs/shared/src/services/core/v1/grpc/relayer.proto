syntax = "proto3";

package core;

message GetRelayerQuery {
  string fromIntegration = 1;
  string fromAccount = 2;
  string fromCurrency = 3;
  string fromAmount = 4;
  string toIntegration = 5;
  string toAccount = 6;
  string toCurrency = 7;
  string toAmount = 8;
}

message RelayerResponse {
  string relayerAccount = 1;
}
