version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: multi-rail-payments-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eventsourcing
    ports:
      - "15432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data

    networks:
      - multi-rail-payments-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: multi-rail-payments-nats-dev
    command:
      - "-js"
      - "-sd"
      - "/data"
      - "-m"
      - "8222"
    ports:
      - "14222:4222"
      - "18222:8222"
    volumes:
      - nats_data_dev:/data
    networks:
      - multi-rail-payments-network
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redpanda:
    image: redpandadata/redpanda:v24.2.18
    container_name: multi-rail-payments-redpanda-dev
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --memory 512M
      - --default-log-level=info
    ports:
      - "19092:19092"
      - "18081:18081"
      - "18082:18082"
      - "19644:9644"
    volumes:
      - redpanda_data_dev:/var/lib/redpanda/data
    networks:
      - multi-rail-payments-network
    healthcheck:
      test: [ "CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redpanda-console:
    image: redpandadata/console:v2.8.3
    container_name: multi-rail-payments-redpanda-console-dev
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "18080:8080"
    networks:
      - multi-rail-payments-network
    depends_on:
      - redpanda

networks:
  multi-rail-payments-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres_data_dev:
    driver: local
  nats_data_dev:
    driver: local
  redpanda_data_dev:
    driver: local